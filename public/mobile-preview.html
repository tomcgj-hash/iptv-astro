<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>手机预览 - IPTVStream</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1e1e2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; font-family: sans-serif; }
  .phone-frame {
    width: 400px;
    height: 860px;
    background: #fff;
    border-radius: 40px;
    border: 10px solid #2d2d3d;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    overflow: hidden;
    position: relative;
  }
  iframe {
    width: 400px;
    height: 860px;
    border: none;
    display: block;
  }
  .label { color: #a0a0b8; margin-top: 16px; font-size: 14px; }
  .label strong { color: #fff; }
</style>
</head>
<body>
  <div class="phone-frame">
    <iframe src="http://localhost:4321/" title="IPTVStream mobile preview"></iframe>
  </div>
  <p class="label">📱 手机模拟（<strong>400px</strong> 宽视口）— 底部应出现导航栏</p>
</body>
</html>
