<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Watch IPTV on Smart TV">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>
  <!-- 电视屏幕 -->
  <rect x="60" y="55" width="280" height="180" rx="12" fill="url(#scr)"/>
  <!-- 屏幕内容：播放三角 -->
  <path d="M165 110 L250 145 L165 180 Z" fill="#ffffff" opacity="0.95"/>
  <!-- 屏幕高光 -->
  <rect x="60" y="55" width="280" height="180" rx="12" fill="url(#scr)" opacity="0"/>
  <ellipse cx="150" cy="95" rx="90" ry="35" fill="#ffffff" opacity="0.08"/>
  <!-- 底座 -->
  <rect x="170" y="240" width="60" height="10" rx="4" fill="#334155"/>
  <rect x="155" y="235" width="90" height="8" rx="4" fill="#475569"/>
  <!-- 品牌文字 -->
  <text x="200" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">IPTVStream</text>
</svg>
