<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Watch IPTV on laptop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>
  <!-- 笔记本屏幕 -->
  <rect x="75" y="50" width="250" height="160" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="85" y="60" width="230" height="140" rx="6" fill="url(#scr)"/>
  <!-- 播放三角 -->
  <path d="M180 115 L225 130 L180 145 Z" fill="#ffffff" opacity="0.95"/>
  <!-- 键盘底座 -->
  <path d="M60 225 L340 225 L360 245 L40 245 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- 品牌文字 -->
  <text x="200" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">IPTVStream</text>
</svg>
