<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Watch IPTV on smartphone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg)"/>
  <!-- 手机机身 -->
  <rect x="140" y="35" width="120" height="240" rx="20" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <!-- 屏幕 -->
  <rect x="150" y="50" width="100" height="210" rx="10" fill="url(#scr)"/>
  <!-- 播放三角 -->
  <path d="M185 130 L225 155 L185 180 Z" fill="#ffffff" opacity="0.95"/>
  <!-- 刘海 -->
  <rect x="175" y="45" width="50" height="8" rx="4" fill="#0f172a"/>
  <!-- 品牌文字 -->
  <text x="200" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">IPTVStream</text>
</svg>
